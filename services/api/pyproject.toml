[project]
name = "corvo-api"
version = "0.1.0"
description = "CORVO simulation and data API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.20"]
# Added in M7 / probes: "aquacrop", "numpy", "pandas", "xarray", "rasterio"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["corvo_api*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
